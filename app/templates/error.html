<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ code }} · {{ app_name }}</title>
  <script src="{{ url_for('static', filename='js/theme-init.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="min-h-screen font-sans antialiased">
  <div class="flex min-h-screen items-center justify-center px-4">
    <div class="card w-full max-w-md p-8 text-center">
      <p class="text-5xl font-semibold tracking-tight text-apple-blue dark:text-apple-blue-dark">{{ code }}</p>
      <h1 class="mt-3 text-xl font-semibold tracking-tight">Algo no salió como esperábamos</h1>
      <p class="mt-2 text-sm text-apple-muted dark:text-apple-muted-dark">{{ message }}</p>
      <div class="mt-6 flex justify-center gap-2">
        {% if current_user.is_authenticated %}
        <a href="{{ url_for('pages.dashboard') }}" class="btn btn-primary">Volver al panel</a>
        {% else %}
        <a href="{{ url_for('pages.login') }}" class="btn btn-primary">Iniciar sesión</a>
        {% endif %}
      </div>
    </div>
  </div>
</body>
</html>
