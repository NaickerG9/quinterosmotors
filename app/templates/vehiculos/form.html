{% extends "base.html" %}
{% block title %}Nuevo vehículo · {{ app_name }}{% endblock %}

{% block content %}
<div class="animate-fade-in">
  <div class="flex items-center gap-2 text-sm text-apple-muted dark:text-apple-muted-dark">
    <a href="{{ url_for('pages.vehiculos') }}" class="hover:text-apple-ink dark:hover:text-apple-ink-dark">Vehículos</a>
    <span>/</span>
    <span>Nuevo</span>
  </div>
  <div class="mt-2">
    <h1 class="text-3xl font-semibold tracking-tight sm:text-4xl">Nuevo vehículo</h1>
    <p class="mt-2 text-sm text-apple-muted dark:text-apple-muted-dark">Completa la información del vehículo. Podrás agregar fotos después de guardarlo.</p>
  </div>
  <div id="vehiculo-form-root" class="mt-6">
    <div class="card p-6">
      <div class="h-64 animate-pulse rounded-xl bg-black/5 dark:bg-white/5"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/pages/vehiculo-form.js') }}"></script>
{% endblock %}
