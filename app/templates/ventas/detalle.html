{% extends "base.html" %}
{% block title %}Detalle de venta · {{ app_name }}{% endblock %}

{% block content %}
<div class="animate-fade-in" id="venta-detalle" data-venta-id="{{ venta_id }}">
  <div class="flex items-center gap-2 text-sm text-apple-muted dark:text-apple-muted-dark">
    <a href="{{ url_for('pages.ventas') }}" class="hover:text-apple-ink dark:hover:text-apple-ink-dark">Ventas</a>
    <span>/</span>
    <span>Detalle</span>
  </div>
  <div id="venta-contenido" class="mt-4">
    <div class="card p-6">
      <div class="h-40 animate-pulse rounded-xl bg-black/5 dark:bg-white/5"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/pages/venta-detalle.js') }}"></script>
{% endblock %}
