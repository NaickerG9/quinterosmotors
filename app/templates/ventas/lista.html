{% extends "base.html" %}
{% block title %}Ventas · {{ app_name }}{% endblock %}

{% block content %}
<div class="animate-fade-in">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <p class="text-xs font-medium uppercase tracking-[0.16em] text-apple-muted dark:text-apple-muted-dark">Operaciones</p>
      <h1 class="mt-1 text-3xl font-semibold tracking-tight sm:text-4xl">Ventas y apartados</h1>
      <p class="mt-2 text-sm text-apple-muted dark:text-apple-muted-dark">Cada venta conserva la tasa y el precio en USD del momento.</p>
    </div>
    <a href="{{ url_for('pages.venta_nueva') }}" class="btn btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="size-4"><path d="M12 5v14M5 12h14"/></svg>
      Nueva venta
    </a>
  </div>

  <form id="filtros-ventas" class="card mt-6 p-4">
    <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-5">
      <div class="lg:col-span-2">
        <label class="label" for="v-q">Buscar</label>
        <input id="v-q" name="q" type="search" class="input" placeholder="Cliente, vehículo, VIN o placa">
      </div>
      <div>
        <label class="label" for="v-estado">Estado</label>
        <select id="v-estado" name="estado" class="input">
          <option value="">Todos</option>
          <option value="apartado">Apartado</option>
          <option value="completada">Completada</option>
          <option value="cancelada">Cancelada</option>
        </select>
      </div>
      <div>
        <label class="label" for="v-desde">Desde</label>
        <input id="v-desde" name="desde" type="date" class="input">
      </div>
      <div>
        <label class="label" for="v-hasta">Hasta</label>
        <input id="v-hasta" name="hasta" type="date" class="input">
      </div>
    </div>
    <div class="mt-3 flex justify-end gap-2">
      <button type="reset" class="btn btn-secondary btn-sm">Limpiar</button>
      <button type="submit" class="btn btn-primary btn-sm">Filtrar</button>
    </div>
  </form>

  <div id="ventas-resultado" class="mt-6" aria-live="polite">
    <div class="card p-6">
      <div class="h-40 animate-pulse rounded-xl bg-black/5 dark:bg-white/5"></div>
    </div>
  </div>
  <div id="ventas-paginacion" class="mt-4"></div>
</div>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/pages/ventas.js') }}"></script>
{% endblock %}
